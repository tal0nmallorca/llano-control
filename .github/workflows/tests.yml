name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-cairo python3-gi-cairo python3-yaml gir1.2-gtk-4.0 gir1.2-gtk-3.0 gir1.2-ayatanaappindicator3-0.1 xvfb
      - name: Unit tests (no hardware writes)
        run: xvfb-run -a /usr/bin/python3 -m unittest discover -s tests -v
      - name: Compile modules
        run: /usr/bin/python3 -m compileall -q llano_control tools
