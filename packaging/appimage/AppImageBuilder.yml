version: 1
script:
  - mkdir -p AppDir/usr/share/llano-control AppDir/usr/share/icons/hicolor/scalable/apps AppDir/usr/share/applications
  - cp -r llano_control packaging LICENSE NOTICE.md AppDir/usr/share/llano-control/
  - cp packaging/appimage/llano-control.svg AppDir/usr/share/icons/hicolor/scalable/apps/
  - cp packaging/appimage/io.github.llanocontrol.App.desktop AppDir/usr/share/applications/
AppDir:
  path: ./AppDir
  app_info:
    id: io.github.llanocontrol.App
    name: Llano-Control
    icon: llano-control
    version: '{{APP_VERSION}}'
    exec: usr/bin/python3
    exec_args: '-m llano_control $@'
  apt:
    arch: amd64
    sources:
      - sourceline: 'deb [arch=amd64] https://archive.ubuntu.com/ubuntu/ noble main universe'
        key_url: 'https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xF6ECB3762474EDA9D21B7022871920D1991BC93C'
      - sourceline: 'deb [arch=amd64] https://archive.ubuntu.com/ubuntu/ noble-updates main universe'
        key_url: 'https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xF6ECB3762474EDA9D21B7022871920D1991BC93C'
      - sourceline: 'deb [arch=amd64] https://security.ubuntu.com/ubuntu/ noble-security main universe'
        key_url: 'https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xF6ECB3762474EDA9D21B7022871920D1991BC93C'
    include:
      - python3
      - python3-gi
      - python3-cairo
      - python3-gi-cairo
      - gir1.2-gtk-4.0
      - gir1.2-gtk-3.0
      - gir1.2-ayatanaappindicator3-0.1
      - adwaita-icon-theme
      - fonts-dejavu-core
    exclude:
      - libgl1-mesa-dri
  runtime:
    # appimage-builder 1.1.0's ELF rewriter corrupts Noble's libc.
    preserve:
      - usr/lib/x86_64-linux-gnu/libc.so.6
    env:
      PYTHONHOME: '${APPDIR}/usr'
      PYTHONPATH: '${APPDIR}/usr/share/llano-control:${APPDIR}/usr/lib/python3/dist-packages'
      PYTHONNOUSERSITE: '1'
      GSK_RENDERER: cairo
  # Noble uses usr/lib64, while patched ELF interpreters use lib64.
  after_runtime:
    - mkdir -p AppDir/runtime/compat/lib64
    - ln -s ../usr/lib/x86_64-linux-gnu/ld-linux-x86-64.so.2 AppDir/runtime/compat/lib64/ld-linux-x86-64.so.2
  files:
    exclude:
      - usr/share/man
      - usr/share/llano-control/llano_control/__pycache__
AppImage:
  arch: x86_64
  file_name: 'Llano-Control-{{APP_VERSION}}-x86_64.AppImage'
